# timber_v1 run 3 (CT-17): run 2 (dice_present_only) with strong augmentation (scale 0.8-1.25, rotation +-10 deg, motion or
# Gaussian blur, lighting gradient, stronger colour jitter, noise) and 32 epochs instead of 64 (run 2 peaked on val at
# epoch 24 and declined after ~40). Aim: smaller train/val gap.

dataset_root: /home/jovyan/work/ctlog-eval/camera_slider_data/timber_v1
dataset_version: timber_v1
min_wood_frac: 0.0

unet_arch: Unet
unet_encoder: tu-tf_efficientnetv2_s
unet_decoder_channels: [512, 256, 128, 64, 32]
bf16: true

lr: 0.0001
num_epochs: 32
batch_size: 6
num_workers: 0
lr_schedule: cosine
warmup_epochs: 0
ema_decay: 0.9995
augment: true
augment_strength: strong
seed: 0

distribution_loss_weight: 0.4
district_loss_weight: 0.6
dice_present_only: true
focal_alpha: 2.0
focal_gamma: 2.0

instance_min_pred_area: 16
best_metric: inst_iou_defects
smoothing_window: 5
train_eval_interval: 4
train_eval_tiles: 1000

checkpoint_path: /home/jovyan/work/ctlog-eval/ckpt/timber_v1_unet_effv2s_dec512_dicepresent_augstrong.pth
resume: true
local_checkpoint_dir: /home/jovyan/work/ctlog-eval/ckpt_local/timber_v1_unet_effv2s_dec512_dicepresent_augstrong
local_checkpoint_keep: 3
save_every_epochs: 10

log_interval: 50
viz_interval: 5
viz_num_tiles: 4
use_local_logger: true
local_log_dir: /home/jovyan/work/ctlog-eval/logs/timber_v1_unet_effv2s_dec512_dicepresent_augstrong
use_mlflow: true
mlflow_experiment_name: ct-timber-v1
mlflow_run_name: timber-v1-unet-effv2s-dec512-dicepresent-augstrong-32ep
mlflow_tracking_uri: https://dagshub.com/AddictionLord/ct-log.mlflow
mlflow_model_min_improvement: 0.005
log_model: true
